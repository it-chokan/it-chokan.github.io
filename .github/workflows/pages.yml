name: Build and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - run: pip install pillow
      - run: python make_ogp.py
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: _indexnow/urls.json
          if-no-files-found: ignore
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    # v15: tell Bing and other IndexNow engines about today's pages right after the site is live
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: indexnow
      - run: |
          python3 - <<'PY'
          import json, urllib.request, time
          d = json.load(open("urls.json"))
          if not d["urlList"]:
              print("indexnow: nothing to send"); raise SystemExit
          time.sleep(20)
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=json.dumps(d).encode(),
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print("indexnow:", r.status, len(d["urlList"]), "urls")
          except urllib.error.HTTPError as e:
              print("indexnow: HTTP", e.code, e.read()[:300])
          PY
